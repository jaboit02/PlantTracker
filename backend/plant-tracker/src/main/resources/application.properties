#spring.config.import=optional:file:/home/jannika/plantTracker/database/.env[.properties]
spring.config.import=optional:file:${user.dir}/../../.env[.properties]
spring.application.name=plant-tracker

# =========================
# SERVER CONFIG
# =========================
server.port=8080

# =========================
# DATABASE CONNECTION
# =========================
# OLD: MSSQL Database Connection
#spring.datasource.url=jdbc:sqlserver://${MSSQL_HOST_IP}:1433;databaseName=${MSSQL_DB};encrypt=true;trustServerCertificate=true;loginTimeout=10
#spring.datasource.username=${MSSQL_USER}
#spring.datasource.password=${MSSQL_PASSWORD}
#spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# NEW: Postgres Database Docker Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# DISABLE AUTO DB BOOT STRAP (IMPORTANT)
# prevents startup crash from DataJdbc auto config
# =========================
spring.sql.init.mode=never
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
spring.jpa.hibernate.ddl-auto=none

# =========================
# LOGGING (useful for debugging)
# =========================
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.boot.autoconfigure.jdbc=DEBUG

# =========================
# WEATHER API
# =========================
weather.api.url=${WEATHER_API_URL:https://api.open-meteo.com/v1/forecast}
weather.latitude=${WEATHER_LATITUDE:48.78}
weather.longitude=${WEATHER_LONGITUDE:9.18}
