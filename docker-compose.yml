# ==============================================================================
# File Name:    docker-compose.yml
# Description:  Infrastructure setup for the PlantTracker database layer.
#               Generates a PostgreSQL container and a secondary database backup worker.
# 
# Architecture Timeline & AI Usage:
#   - October 2026:   The core infrastructure requirements were designed manually. 
#                     An LLM (Gemini) assisted during container configuration to:
#                     1. Troubleshoot engine versions (pinned stable PostgreSQL 17 
#                        after version 18 configuration attempts failed).
#                     2. Implement secure credential handling via .env variables.
#                     3. Structure the 'db-backup' service using automated pg_dump.
#                     4. Configure automated database initialization by correctly 
#                        mapping initialization scripts into '/docker-entrypoint-initdb.d'.
# ==============================================================================

services:
  postgres_db:
    image: postgres:17
    container_name: planttracker_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./database/postgres_data:/var/lib/postgresql/data    # DB-Data
      - ./database/init-db:/docker-entrypoint-initdb.d       # Shell script calling the SQL scripts to initalize the database
      - ./database/PostgreSQL_Scripts:/original_scripts      # SQL scripts to create database

  db-backup:
    image: postgres:17
    container_name: planttracker_backup
    volumes:
      - ./database/backups:/planttracker_data_backups
    entrypoint: ["pg_dump", "-h", "postgres_db", "-U", "${DB_USER}", "-F", "c", "-b", "-v", "-f", "/planttracker_data_backups/db.dump", "${DB_NAME}"]
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres_db

